<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resultados</title>
    <!-- link que liga o HTML ao CSS -->
    <link rel="stylesheet" href="style.css" />
    <!-- link que liga o HTML ao manifest -->
    <link rel="manifest" href="manifest.json" />
    <!-- link que liga o HTML ao ícone -->
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
  </head>
  <body>
    <!-- cabeçalho da página -->
    <header>
      <h1>CEP Finder</h1>
      <p>Consulte seu CEP sem dificuldade!</p>
    </header>

    <!-- conteúdo principal da página -->
    <main>
      <h1>Resultado da consulta</h1>
      <!-- container para exibir os resultados da pesquisa -->
      <div id="resultado" role="status" aria-live="polite"></div>
      <a id="linkMaps" hidden target="_blank" rel="noopener noreferrer"
        >Abrir no Google Maps</a
      >
      <p><a href="index.html">Fazer nova consulta</a></p>
    </main>

    <!-- rodapé da página -->
    <footer>
      <p>&copy; 2026 - CEP Finder. Feito por Gabriel Correa.</p>
    </footer>
    <script src="resultado.js"></script>
  </body>
</html>
